<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gate Pass System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--cream:#FFF6E9;--ink:#2a1810;--mut:#8a6f5f;--or:#F7931E;--am:#FFB627;--rd:#E8453C;--mg:#B5179E;--ok:#1f9d55;--bd:#f2e2cf;--grad:linear-gradient(120deg,#FFB627,#F7931E 30%,#E8453C 65%,#B5179E)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-2;background:radial-gradient(40% 30% at 15% 5%,#ffd6a0,transparent 70%),radial-gradient(35% 30% at 95% 30%,#f9b4d8,transparent 70%),radial-gradient(40% 30% at 20% 100%,#ffc98a,transparent 70%);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(3%,2%,0) scale(1.08)}}
#embers{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#embers span{position:absolute;bottom:-14px;border-radius:50%;background:radial-gradient(circle,#ffb627,#e8453c 70%,transparent);opacity:0;animation:rise linear infinite}
@keyframes rise{10%{opacity:.8}100%{transform:translate3d(30px,-105vh,0);opacity:0}}
.wrap{max-width:460px;margin:0 auto;padding:62px 16px 24px}.wide{max-width:720px}body.in{padding-bottom:92px}
.conn{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;z-index:60;display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;background:#fff;border:1px solid var(--bd);font-size:12px;font-weight:600;box-shadow:0 6px 18px -8px #b5179e55}
.conn i{width:9px;height:9px;border-radius:50%;background:var(--am);animation:blink 1s infinite}
.conn.live i{background:var(--ok);animation:ping 1.8s infinite}.conn.off i{background:var(--rd);animation:none}
@keyframes blink{50%{opacity:.3}}@keyframes ping{0%{box-shadow:0 0 0 0 #1f9d5588}80%,100%{box-shadow:0 0 0 8px #1f9d5500}}
.hero{position:relative;text-align:center;margin:4px 0 6px}.hero .logo{position:relative;width:230px;max-width:70%;animation:float 4s ease-in-out infinite}
.glow{position:absolute;left:50%;top:38%;width:240px;height:240px;margin:-120px;border-radius:50%;background:radial-gradient(circle,#ffb62788,#e8453c33 55%,transparent 70%);filter:blur(10px);animation:glow 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}@keyframes glow{50%{transform:scale(1.18);opacity:.7}}
.logo{mix-blend-mode:multiply;display:block;margin:0 auto}
.card{background:#fff;border:1px solid var(--bd);border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:0 18px 40px -22px #b5179e66;animation:up .55s both}
@keyframes up{from{opacity:0;transform:translateY(16px)}}@keyframes pop{from{opacity:0;transform:scale(.92)}}
h1{font-family:"Playfair Display",Georgia,serif;font-size:24px;margin:0 0 4px}h2{font-family:"Playfair Display",Georgia,serif;font-size:19px;margin:0 0 6px}
.s{color:var(--mut);font-size:13px;margin:0 0 10px}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:14px 0 5px;letter-spacing:.03em}
input[type=text],input[type=password],input[type=tel],input[type=date]{width:100%;height:50px;padding:0 14px;border:2px solid var(--bd);border-radius:14px;background:#fffdf9;color:var(--ink);font:500 16px Poppins,system-ui,sans-serif;transition:.2s}
input:focus{outline:0;border-color:var(--or);box-shadow:0 0 0 4px #f7931e2e}
.ck{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.ck label{margin:0;display:flex;gap:8px;align-items:center;padding:10px 12px;border:2px solid var(--bd);border-radius:12px;font-size:13px;color:var(--ink);letter-spacing:0}
.ck input{accent-color:var(--rd);width:18px;height:18px}
button{font:600 15px Poppins,system-ui,sans-serif;min-height:48px;padding:0 18px;border:0;border-radius:14px;color:#fff;background:var(--grad);background-size:220% 100%;cursor:pointer;transition:transform .15s,box-shadow .2s,background-position .6s;box-shadow:0 10px 22px -10px #e8453c99}
button:hover{background-position:100% 0}button:active{transform:scale(.96)}button:disabled{opacity:.55}
button.g{background:#fff;color:var(--ink);border:2px solid var(--bd);box-shadow:none}button.d{background:#fff;color:var(--rd);border:2px solid #f6cfcb;box-shadow:none}
button.sm{min-height:38px;padding:0 12px;font-size:12px}.full{width:100%;margin-top:20px}
.msg{font-size:13px;font-weight:500;margin-top:12px;min-height:16px}.er{color:var(--rd)}.ok{color:var(--ok)}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:16px;animation:up .5s both}.hd .logo{width:64px;flex:none;margin:0}.who{flex:1;min-width:0}.who b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;background:#fff1de;color:#b25b00;margin:2px 4px 0 0}.chip.m{background:#fde4f5;color:var(--mg)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:520px){.row{grid-template-columns:1fr}}
.view{animation:up .5s both}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:#ffffffee;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;position:relative;min-height:56px;background:none;color:var(--mut);box-shadow:none;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;padding:0}
.tabs i{font-style:normal;font-size:21px;transition:transform .3s}
.tabs button.on{color:var(--mg)}.tabs button.on i{transform:translateY(-3px) scale(1.18)}
.tabs button.on::before{content:"";position:absolute;top:-7px;width:30px;height:4px;border-radius:0 0 4px 4px;background:var(--grad)}
.pc{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px;border:1px solid var(--bd);border-radius:18px;background:#fff;margin-bottom:10px;animation:up .4s both;box-shadow:0 10px 24px -20px #b5179e}
.av{width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.pi{flex:1;min-width:0}.pi b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pi small{color:var(--mut);font-size:12px}
.st{font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;background:#eef2ee;color:var(--mut)}.st.u{background:#dcf5e6;color:var(--ok)}.st.off{background:#fde3e1;color:var(--rd)}
.acts{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%}.empty{text-align:center;color:var(--mut);padding:28px 8px;font-size:14px}
#stats{display:flex;gap:8px;margin-bottom:12px;animation:up .4s both}
video{width:100%;border-radius:18px;background:#000;max-height:300px;margin-top:6px}
.res{border-radius:20px;padding:16px;margin-top:14px;border:2px solid var(--bd);background:#fffdf9;animation:pop .35s both}.res.okk{border-color:var(--ok);background:#f2fcf6}.res.bad{border-color:var(--rd);background:#fff5f4}
.res dt{font-size:11px;font-weight:600;color:var(--mut);margin-top:10px;letter-spacing:.05em;text-transform:uppercase}.res dd{margin:2px 0 0;font-size:17px;font-weight:600}
.foot{text-align:center;color:var(--mut);font-size:11px;margin-top:6px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*,::before{animation:none!important;transition:none!important}}
</style></head><body>

<div id="embers"></div>
<div class="conn" id="conn"><i></i><b>Connecting</b></div>

<main id="login" class="wrap">
  <div class="hero"><div class="glow"></div><img class="logo" alt="Bonfire"></div>
  <div class="card"><h1>Welcome back</h1><p class="s">Staff sign-in for the gate pass system</p>
    <label for="uid">USER ID</label><input type="text" id="uid" autocomplete="username">
    <label for="pw">PASSWORD</label><input type="password" id="pw" autocomplete="current-password">
    <button class="full" id="loginBtn">Sign in</button><div class="msg er" id="lmsg"></div></div>
  <div class="foot">Authorised staff only</div>
</main>

<div id="app" class="wrap wide hide">
  <header class="hd"><img class="logo" alt="Bonfire"><div class="who"><b id="hello"></b><span class="chip m" id="perm"></span></div><button class="g sm" id="logout">Sign out</button></header>

  <section id="vIssue" class="card view hide"><h2>Issue a pass</h2><p class="s">All three details are required.</p>
    <div class="row"><div><label for="pName">FULL NAME</label><input type="text" id="pName" autocomplete="off"></div>
    <div><label for="pPh">PHONE NUMBER</label><input type="tel" id="pPh" autocomplete="off" inputmode="tel"></div>
    <div><label for="pDob">DATE OF BIRTH</label><input type="date" id="pDob"></div></div>
    <button class="full" id="issueBtn">Issue pass</button><div class="msg" id="imsg"></div>
    <button class="g hide full" id="dlBtn" style="margin-top:6px">Download pass (PDF)</button></section>

  <section id="vPasses" class="view hide"><div id="stats"></div><div id="plist"></div></section>

  <section id="vScan" class="view hide"><div class="card"><h2>Scan a pass</h2><p class="s">Point the camera at the QR, or use a handheld scanner.</p>
    <video id="vid" playsinline muted class="hide"></video><canvas id="cv" class="hide"></canvas><div class="msg er" id="cmsg"></div>
    <label for="manual">SCANNER DEVICE OR MANUAL CODE</label><input type="text" id="manual" autocomplete="off" autocapitalize="characters">
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button id="camBtn">Start camera</button><button class="g" id="photoBtn">Scan using phone camera app</button><button class="g" id="verBtn">Verify code</button></div><input type="file" id="photo" accept="image/*" capture="environment" class="hide">
    <div id="result"></div></div></section>

  <section id="vUsers" class="view hide">
    <div class="card"><h2>Grant access</h2><p class="s">A user can have issue access, scan access, or both.</p>
      <div class="row"><div><label for="nName">FULL NAME</label><input type="text" id="nName"></div>
      <div><label for="nId">USER ID</label><input type="text" id="nId" autocomplete="off"></div>
      <div><label for="nPw">PASSWORD (MIN 8)</label><input type="password" id="nPw" autocomplete="new-password"></div></div>
      <div class="ck"><label><input type="checkbox" id="nIssue" checked> Can issue passes</label><label><input type="checkbox" id="nScan"> Can scan passes</label></div>
      <button class="full" id="addUser">Add user</button><div class="msg" id="umsg"></div></div>
    <div id="ulist"></div>
  </section>
  <nav class="tabs" id="tabs"></nav>
</div>

    if(!p){box("bad","<strong class='er'>INVALID PASS</strong>");return}
    const rr=await store.claim(code,{at:new Date().toISOString(),by:u.name,byId:u.id}),s=rr.val,dup=!rr.first;
    const f=(k,v)=>`<dt>${k}</dt><dd>${esc(v)}</dd>`;
    box(dup?"bad":"okk",(dup?`<strong class="er">ALREADY USED at ${esc(fmt(s.at))} by ${esc(s.by||"")}</strong>`:`<strong class="ok">VALID. Entry registered ${esc(fmt(s.at))}</strong>`)+
      "<dl style='margin:0'>"+f("Name",p.name)+f("Date of birth",p.dob)+f("Phone",p.phone)+f("Issued by",p.issuedBy)+f("Issued on",fmt(p.issuedAt))+"</dl>"+
      `<button style="margin-top:12px" id="nextBtn">Scan next</button>`);
    $("nextBtn").onclick=()=>{out.innerHTML="";startCam()};
  }catch(e){box("bad","<strong class='er'>Lookup failed. "+esc(why(e))+"</strong>")}
  finally{busy=false}
}

/* users */
async function renderUsers(){
  const b=$("ulist");b.innerHTML='<div class="empty">Loading...</div>';
  try{const us=await store.list("users");
    b.innerHTML=us.length?us.map(r=>`<div class="pc"><div class="av">${esc([...(r.name||"?")][0].toUpperCase())}</div><div class="pi"><b>${esc(r.name)}</b><small>${esc(r.id)} | ${[r.issue&&"Issue",r.scan&&"Scan"].filter(Boolean).join(" + ")}</small></div><span class="st ${r.active?"u":"off"}">${r.active?"Active":"Disabled"}</span>
      <div class="acts"><button class="g sm" data-a="i" data-i="${esc(r.id)}">${r.issue?"Remove":"Give"} issue</button><button class="g sm" data-a="s" data-i="${esc(r.id)}">${r.scan?"Remove":"Give"} scan</button><button class="g sm" data-a="t" data-i="${esc(r.id)}">${r.active?"Disable":"Enable"}</button><button class="g sm" data-a="p" data-i="${esc(r.id)}">Reset pw</button><button class="d sm" data-a="x" data-i="${esc(r.id)}">Delete</button></div></div>`).join(""):'<div class="empty">No staff users yet.</div>'}
  catch(e){b.innerHTML='<div class="empty er">'+esc(why(e))+'</div>'}
}
async function addUser(){
  const u=sess(),m=$("umsg");m.className="msg er";if(!u||!u.admin)return;
  const name=$("nName").value.trim(),id=$("nId").value.trim(),pw=$("nPw").value,is=$("nIssue").checked,sc=$("nScan").checked;
  if(!name||!/^[\w-]{3,30}$/.test(id)){m.textContent="Name and a valid ID (3 to 30 letters, digits, _ or -) required.";return}
  if(id===ADMIN.id){m.textContent="That ID is reserved.";return}
  if(pw.length<8){m.textContent="Password must be at least 8 characters.";return}
  if(!is&&!sc){m.textContent="Give at least one access.";return}
  try{if(await store.get("users",id)){m.textContent="ID already exists.";return}
    const salt=rnd();await store.put("users",id,{name,issue:is,scan:sc,active:true,salt,hash:await kdf(pw,salt),created:new Date().toISOString()})}
  catch(e){m.textContent="Could not save. "+why(e);return}
  m.className="msg ok";m.textContent="User added.";["nName","nId","nPw"].forEach(i=>$(i).value="");renderUsers();
}
async function userAct(e){
  const b=e.target.closest("button[data-a]"),u=sess();if(!b||!u||!u.admin)return;
  const id=b.dataset.i,a=b.dataset.a;
  try{const r=await store.get("users",id);if(!r)return;
    if(a==="i"||a==="s"){const k=a==="i"?"issue":"scan",o=a==="i"?"scan":"issue";if(r[k]&&!r[o]){alert("A user needs at least one access. Disable or delete instead.");return}r[k]=!r[k]}
    if(a==="t")r.active=!r.active;
    if(a==="x"){if(!confirm("Delete "+id+"?"))return;await store.del("users",id);return renderUsers()}
    if(a==="p"){const p=prompt("New password for "+id+" (min 8):");if(!p)return;if(p.length<8){alert("Too short.");return}r.salt=rnd();r.hash=await kdf(p,r.salt)}
    await store.put("users",id,r);renderUsers()}
  catch(err){alert("Update failed.")}
}
